<style>
  .desktop-layout {
    display: flex;
    min-height: 100vh;
    width: 100%;
    background: #ffffff;
  }

  .desktop-sidebar {
    display: flex;
    align-items: flex-start;
    flex-direction: column;
    height: 100vh;
    width: 250px;
    border-right: 1px solid #e0e0e0;
    background: #efefef;
  }

  .sidebar-header {
    display: flex;
    box-sizing: border-box;
    align-items: center;
    justify-content: flex-start;
    height: auto;
    width: auto;
    gap: 10px;
    padding: 5px;
    margin: 5px;
    background: #efefef;
  }

  .sidebar-logo {
    height: 60px;
    width: 60px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .sidebar-brand-info {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .company-name {
    font-size: 14px;
    font-weight: bold;
    color: #212121;
    line-height: 1.2;
  }
  
  .company-email {
    font-size: 10px;
    color: #757575;
    line-height: 1.3;
    margin-top: 1px;
    word-break: break-all;
  }

  .sidebar-menu {
    display: flex;
    flex-direction: column;
    width: 100%;
    padding: 10px;
    gap: 3px;
    flex: 1;
  }

  .menu-title {
    font-size: 13px;
    font-weight: 500;
    color: #757575;
    letter-spacing: 0.3px;
    padding: 10px 10px 10px 5px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 8px;
    padding: 8px;
    color: #4a5568;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.3px;
    text-decoration: none;
    border-radius: 12px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
  }

  .menu-item span {
    display: inline-flex;
    align-items: center;
    position: relative;
    top: 2px;
    line-height: 1;
    transform: translateY(-1px);
    font-weight: 500;
  }

    .menu-item:hover {
    background-color: #ffffff;
    color: #212121;
    transform: translateX(4px);
  }

  .menu-item.active {
    width: 100%;
    border: 1px solid #e0e0e0;
    color: #212121;
    background-color: #ffffff;
  }

  .menu-item.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  .content-container {
    display: flex;
    flex: 1;
    height: 100vh;
    flex-direction: column;
    width: 774px;
    min-height: 100vh;
  }

  .content-header {
    display: flex;
    box-sizing: border-box;
    justify-content: flex-start;
    align-items: center;
    flex-shrink: 0;
    height: 50px;
    width: 774px;
    border-bottom: 1px solid #e0e0e0;
  }

  .content-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 20px;
    font-size: 18px;
    font-weight: 600;
  }

  .content-title span {
    transform: translateY(2px);
  }

</style>
